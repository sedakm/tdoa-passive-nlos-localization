[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdoa-loc"
version = "0.1.0"
description = "TDOA passive localization simulation framework — LOS/NLOS mixed environments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "h5py>=3.9",
    "tqdm>=4.65",
    "scikit-posthocs>=0.9",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]

[project.scripts]
run-experiment   = "tdoa_loc.scripts.run_experiment:main"
plot-results     = "tdoa_loc.scripts.plot_results:main"
plot-ml          = "tdoa_loc.scripts.plot_ml_function:main"

[tool.setuptools.packages.find]
where = ["src"]
