# Experiment: random geometry — receivers and target randomly placed each run
# 4 receivers sampled uniformly in [-500, 500] x [-500, 500].
# Target sampled uniformly in [-200, 200] x [-200, 200] (inner region).

experiment_name: random_geometry

geometry:
  type: random
  tx: [0.0, 0.0]
  n_receivers: 4
  area_bounds: [-500, 500, -500, 500]   # [xmin, xmax, ymin, ymax]
  # seed: null  # null = resample receivers every run (different geometry per run)

target:
  type: random
  area_bounds: [-200, 200, -200, 200]

noise:
  sigma_los: 2.0
  p_los: 0.7
  mu_b_ratio: 2.5
  sigma_b_db_range: [-50, 50]
  n_sigma_levels: 21

simulation:
  n_runs: 1000
  n_jobs: -1
  seed: 42
  bounds: [-800, 800, -800, 800]

algorithms:
  - short_name: DE
    type: scipy_de
    params:
      popsize: 15
      maxiter: 1000
      tol: 1.0e-6

  - short_name: NM
    type: scipy_minimize
    params:
      method: Nelder-Mead
      options:
        maxiter: 2000
        xatol: 1.0e-6
        fatol: 1.0e-8

  - short_name: CWLS
    type: cwls
    params:
      max_iter: 50
      tol: 1.0e-6

  # - short_name: BOA
  #   type: optbench
  #   class: optbench.algorithms.boa.ButterflyOptimization
  #   params:
  #     pop_size: 100
  #   max_evals: 10000

output:
  results_dir: results/
  figures_dir: figures/
